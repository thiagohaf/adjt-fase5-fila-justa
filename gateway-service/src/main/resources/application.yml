server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Unica rota publica alem do health-check (AD-8/AD-14): login
            # nao exige token (ninguem tem token antes de logar). Sem
            # filtro de validacao de JWT -- o filtro global que protege
            # qualquer outra rota fica deferido (deferred-work.md, AC-3/AC-4).
            #
            # Host "auth-service" (SEM sufixo ".confirmasus.local"): o dnsName
            # do Service Connect e resolvido pelo Envoy pela string exata
            # configurada (FilaJustaStack.buildAuthService), nao pelo nome
            # qualificado com o namespace -- mesmo bug de DNS encontrado e
            # corrigido no datasource do auth-service (ver application.yml).
            - id: auth-login
              uri: http://auth-service:8081
              predicates:
                - Path=/v1/auth/login
                - Method=POST

            # Registro de Agendamento (Story 1.1, Epic 1) -- protegida pelo
            # JwtAuthenticationFilter (nao entra na allowlist publica, AD-8):
            # so requests com Bearer token valido alcancam este servico.
            # Host "agendamento-confirmacao-service" (SEM sufixo de
            # namespace -- mesmo padrao de "auth-service" acima, resolvido
            # pelo Envoy do Service Connect pela string exata do dnsName
            # configurado em FilaJustaStack.buildAgendamentoConfirmacaoService).
            - id: agendamento-confirmacao-registrar
              uri: http://agendamento-confirmacao-service:8082
              predicates:
                - Path=/v1/agendamentos
                - Method=POST

# Segredo compartilhado com o auth-service (mesmo par HS256, AD-14) -- so
# variavel de ambiente/Secrets Manager, nunca no repositorio (NFR-6).
# Consumido pelo JwtAuthenticationFilter (infrastructure/security) que
# valida assinatura/expiracao de qualquer rota fora da allowlist publica.
confirmasus:
  jwt:
    secret: ${CONFIRMASUS_JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"gateway-service","logger":"%c","message":"%m"}%n'
