server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Unica rota publica alem do health-check (AD-8/AD-14): login
            # nao exige token (ninguem tem token antes de logar). Sem
            # filtro de validacao de JWT -- o filtro global que protege
            # qualquer outra rota fica deferido (deferred-work.md, AC-3/AC-4).
            - id: auth-login
              uri: http://auth-service.filajusta.local:8081
              predicates:
                - Path=/v1/auth/login
                - Method=POST

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"gateway-service","logger":"%c","message":"%m"}%n'
