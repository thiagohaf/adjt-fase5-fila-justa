server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Unica rota publica alem do health-check (AD-8/AD-14): login
            # nao exige token (ninguem tem token antes de logar). Sem
            # filtro de validacao de JWT -- o filtro global que protege
            # qualquer outra rota fica deferido (deferred-work.md, AC-3/AC-4).
            #
            # Host "auth-service" (SEM sufixo ".confirmasus.local"): o dnsName
            # do Service Connect e resolvido pelo Envoy pela string exata
            # configurada (ConfirmaSusStack.buildAuthService), nao pelo nome
            # qualificado com o namespace -- mesmo bug de DNS encontrado e
            # corrigido no datasource do auth-service (ver application.yml).
            - id: auth-login
              uri: http://auth-service:8081
              predicates:
                - Path=/v1/auth/login
                - Method=POST

            # Registro de Agendamento (Story 1.1, Epic 1) -- protegida pelo
            # JwtAuthenticationFilter (nao entra na allowlist publica, AD-8):
            # so requests com Bearer token valido alcancam este servico.
            # Host "agendamento-confirmacao-service" (SEM sufixo de
            # namespace -- mesmo padrao de "auth-service" acima, resolvido
            # pelo Envoy do Service Connect pela string exata do dnsName
            # configurado em ConfirmaSusStack.buildAgendamentoConfirmacaoService).
            - id: agendamento-confirmacao-registrar
              uri: http://agendamento-confirmacao-service:8082
              predicates:
                - Path=/v1/agendamentos
                - Method=POST

            # Confirmacao/recusa de presenca (Story 1.3/1.4, Epic 1) --
            # POST /v1/agendamentos/{id}/confirmacao e /recusa. Faltava esta
            # rota: so existiam GET (consultar/listar) e POST exato em
            # /v1/agendamentos (registrar), entao o gateway devolvia 404
            # para qualquer POST em subpath, mesmo com o servico respondendo
            # 200 quando chamado direto (achado ao investigar confirmar/
            # recusar quebrados end-to-end via gateway).
            - id: agendamento-confirmacao-acoes
              uri: http://agendamento-confirmacao-service:8082
              predicates:
                - Path=/v1/agendamentos/**
                - Method=POST

            - id: agendamento-confirmacao-consultar
              uri: http://agendamento-confirmacao-service:8082
              predicates:
                - Path=/v1/agendamentos/**
                - Method=GET

            # Recursos e Alocacoes (Story 3, Epic 3) -- rota publica protegida
            # pelo JwtAuthenticationFilter
            - id: matching-recursos
              uri: http://matching-alocacao-service:8083
              predicates:
                - Path=/v1/recursos/**,/v1/alocacoes/**

            # Lista de Espera (Story 5.3, Epic 5) -- rota publica protegida
            - id: lista-espera
              uri: http://matching-alocacao-service:8083
              predicates:
                - Path=/v1/lista-espera/**

            # Auditoria (Story 4, Epic 4) -- rota publica protegida
            - id: auditoria
              uri: http://auditoria-service:8085
              predicates:
                - Path=/v1/auditoria/**

# Segredo compartilhado com o auth-service (mesmo par HS256, AD-14) -- so
# variavel de ambiente/Secrets Manager, nunca no repositorio (NFR-6).
# Consumido pelo JwtAuthenticationFilter (infrastructure/security) que
# valida assinatura/expiracao de qualquer rota fora da allowlist publica.
confirmasus:
  jwt:
    secret: ${CONFIRMASUS_JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

# Logging: padrão JSON estruturado via LogstashEncoder (logback-spring.xml, Deferred P2)
