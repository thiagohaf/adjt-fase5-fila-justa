spring:
  application:
    name: auditoria-service-test
  datasource:
    url: jdbc:postgresql://localhost:5432/confirmasus_test
    username: confirmasus
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: auditoria

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Desabilitar relay para testes unitários (será habilitado em testes de integração)
confirmasus:
  auditoria:
    relay:
      enabled: false

aws:
  region: us-east-1
