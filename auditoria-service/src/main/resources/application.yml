spring:
  application:
    name: auditoria-service
  datasource:
    url: jdbc:postgresql://localhost:5432/confirmasus
    username: ${DB_USERNAME:confirmasus}
    password: ${DB_PASSWORD:password}
    hikari:
      pool-size: 10
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: auditoria
    sql-migration-prefix: V
    sql-migration-suffixes: .sql

server:
  port: 8084
  servlet:
    context-path: /auditoria

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      simple:
        enabled: true

# Configuração do consumidor SQS (Story 4.1)
confirmasus:
  auditoria:
    relay:
      enabled: ${AUDITORIA_RELAY_ENABLED:true}
      queue-url: ${AUDITORIA_QUEUE_URL:}
      batch-size: ${AUDITORIA_BATCH_SIZE:10}
      wait-time-seconds: ${AUDITORIA_WAIT_TIME_SECONDS:1}
      poll-interval-ms: ${AUDITORIA_POLL_INTERVAL_MS:5000}

# AWS configuration (via SDK default providers)
aws:
  region: ${AWS_REGION:us-east-1}
