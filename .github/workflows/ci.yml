name: CI

# Build/test do reactor Maven (todos 7 serviços Spring Boot + seed-adapter) e
# validação da stack CDK (cdk synth) em todo push/PR. Não toca a conta AWS —
# distinto do deploy/pause/destroy real, que segue manual.
on:
  push:
    branches: [develop, master, main]
  pull_request:

jobs:
  test-reactor:
    name: Test Spring Boot Reactor (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: mvn test (todos 7 serviços Spring Boot)
        run: mvn -B test

  test-seed-adapter:
    name: Test Seed Adapter (Quarkus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: mvn test seed-adapter (Quarkus/Lambda)
        working-directory: seed-adapter
        run: mvn -B test

  validate-cdk:
    name: Validate CDK Stack (cdk synth)
    runs-on: ubuntu-latest
    needs: test-reactor
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js (CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Build infra-cdk (prerequisito para cdk synth)
        run: mvn -B -pl infra-cdk package -DskipTests

      - name: cdk synth (valida stack CloudFormation sem deployar)
        working-directory: infra-cdk
        run: cdk synth
